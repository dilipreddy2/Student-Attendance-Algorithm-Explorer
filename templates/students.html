
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records - AttendX</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b1020;
            color: white;
            padding: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        h1, h2, h3 {
            color: #38d9c5;
        }

        a {
            color: #38d9c5;
            text-decoration: none;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .box {
            background: #151d33;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #354361;
            border-radius: 7px;
            background: #0b1020;
            color: white;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            background: #38d9c5;
            font-weight: bold;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #354361;
        }

        th {
            color: #38d9c5;
        }

        .message {
            margin: 12px 0;
        }

        .delete {
            background: #ef6262;
            color: white;
        }

        .table-wrap {
            overflow-x: auto;
        }
    </style>
</head>

<body>

<header>
    <h2>AttendX</h2>
    <a href="../index.html">← Back to Home</a>
</header>

<div class="container">

    <h1>Student Records</h1>
    <br>

    <div class="box">

        <h3>Add New Student</h3>

        <form id="studentForm">

            <input id="studentId"
                   placeholder="Student ID"
                   required>

            <input id="studentName"
                   placeholder="Student Name"
                   required>

            <input id="department"
                   placeholder="Department"
                   required>

            <input id="year"
                   type="number"
                   placeholder="Year (1-4)"
                   min="1"
                   max="4"
                   required>

            <button type="submit">Add Student</button>

        </form>

        <p class="message" id="message"></p>

    </div>

    <div class="box">

        <h3>Student List</h3>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Year</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentList"></tbody>

            </table>

        </div>

    </div>

</div>

<script>

    let students = JSON.parse(
        localStorage.getItem("attendxStudents")
    ) || [];

    const form = document.getElementById("studentForm");
    const list = document.getElementById("studentList");
    const message = document.getElementById("message");

    function displayStudents() {

        list.innerHTML = "";

        if (students.length === 0) {
            list.innerHTML =
                '<tr><td colspan="5">No students added yet.</td></tr>';
            return;
        }

        students.forEach((student, index) => {

            const row = document.createElement("tr");

            [student.id, student.name,
             student.department, student.year].forEach(value => {

                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);

            });

            const actionCell = document.createElement("td");

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete";

            deleteButton.onclick = () => deleteStudent(index);

            actionCell.appendChild(deleteButton);
            row.appendChild(actionCell);

            list.appendChild(row);

        });

    }

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const id = document.getElementById("studentId").value.trim();
        const name = document.getElementById("studentName").value.trim();
        const department = document.getElementById("department").value.trim();
        const year = Number(document.getElementById("year").value);

        if (year < 1 || year > 4) {
            message.textContent = "Year must be between 1 and 4.";
            message.style.color = "#ff8585";
            return;
        }

        if (students.some(student =>
            student.id.toLowerCase() === id.toLowerCase()
        )) {
            message.textContent = "This Student ID already exists!";
            message.style.color = "#ff8585";
            return;
        }

        students.push({
            id: id,
            name: name,
            department: department,
            year: year
        });

        localStorage.setItem(
            "attendxStudents",
            JSON.stringify(students)
        );

        message.textContent = "Student added successfully!";
        message.style.color = "#38d9c5";

        form.reset();

        displayStudents();

    });

    function deleteStudent(index) {

        students.splice(index, 1);

        localStorage.setItem(
            "attendxStudents",
            JSON.stringify(students)
        );

        displayStudents();

        message.textContent = "Student deleted successfully!";
        message.style.color = "#38d9c5";

    }

    displayStudents();

</script>

</body>
</html>
