
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records - AttendX</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b1020;
            color: white;
            padding: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        header h2, h3 {
            color: #38d9c5;
        }

        a {
            color: #38d9c5;
            text-decoration: none;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .box {
            background: #151d33;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 10px;
        }

        h3 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #354361;
            border-radius: 7px;
            background: #0b1020;
            color: white;
        }

        button {
            padding: 13px 25px;
            border: none;
            border-radius: 7px;
            background: #38d9c5;
            font-weight: bold;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #354361;
        }

        th {
            color: #38d9c5;
        }

        .message {
            color: #ff8585;
            margin-bottom: 15px;
        }

        .empty {
            color: #b8c2d9;
        }
    </style>
</head>

<body>

    <header>
        <h2>AttendX</h2>
        <a href="/">← Back to Home</a>
    </header>

    <div class="container">

        <h1>Student Records</h1>
        <br>

        <div class="box">

            <h3>Add New Student</h3>

            <p class="message">{{ error }}</p>

            <form method="POST">

                <input type="text"
                       name="student_id"
                       placeholder="Student ID"
                       required>

                <input type="text"
                       name="name"
                       placeholder="Student Name"
                       required>

                <input type="text"
                       name="department"
                       placeholder="Department"
                       required>

                <input type="number"
                       name="year"
                       placeholder="Year (1-4)"
                       min="1"
                       max="4"
                       required>

                <button type="submit">Add Student</button>

            </form>

        </div>

        <div class="box">

            <h3>Student List</h3>

            <table>

                <tr>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Year</th>
                </tr>

                {% for student in students %}

                <tr>
                    <td>{{ student['id'] }}</td>
                    <td>{{ student['name'] }}</td>
                    <td>{{ student['department'] }}</td>
                    <td>{{ student['year'] }}</td>
                </tr>

                {% else %}

                <tr>
                    <td colspan="4" class="empty">
                        No students added yet.
                    </td>
                </tr>

                {% endfor %}

            </table>

        </div>

    </div>

</body>
</html>
