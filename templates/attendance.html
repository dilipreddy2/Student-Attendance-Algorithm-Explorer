
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX - Attendance Tracking</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b1020;
            color: white;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            color: #38d9c5;
            text-align: center;
            margin: 25px 0;
        }

        .card {
            background: #151d33;
            padding: 25px;
            margin-top: 25px;
            border-radius: 12px;
            border: 1px solid #293653;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            color: #38d9c5;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #293653;
            border-radius: 7px;
            background: #0b1020;
            color: white;
        }

        button {
            background: #38d9c5;
            color: #07111e;
            padding: 13px 22px;
            border: none;
            border-radius: 7px;
            margin-top: 22px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #20bba9;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px;
            border: 1px solid #293653;
            text-align: left;
        }

        th {
            color: #38d9c5;
        }

        .message {
            margin-top: 15px;
            color: #38d9c5;
        }

        .percentage {
            color: #38d9c5;
            font-weight: bold;
        }

        a {
            color: #38d9c5;
            text-decoration: none;
        }

        .table-wrapper {
            overflow-x: auto;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="../index.html">← Back to Home</a>

    <h1>Attendance Tracking</h1>

    <div class="card">

        <h2>Mark Student Attendance</h2>

        <form id="attendanceForm">

            <label for="student">Select Student</label>
            <select id="student" required>
                <option value="">Select a student</option>
            </select>

            <label for="date">Attendance Date</label>
            <input type="date" id="date" required>

            <label for="status">Attendance Status</label>
            <select id="status" required>
                <option value="Present">Present</option>
                <option value="Absent">Absent</option>
            </select>

            <button type="submit">Save Attendance</button>

        </form>

        <p class="message" id="message"></p>

    </div>

    <div class="card">

        <h2>Attendance Records</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="attendanceTable"></tbody>
            </table>
        </div>

    </div>

    <div class="card">

        <h2>Attendance Percentage</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Total Classes</th>
                        <th>Present</th>
                        <th>Percentage</th>
                    </tr>
                </thead>

                <tbody id="percentageTable"></tbody>
            </table>
        </div>

    </div>

</div>

<script>

const STUDENTS_KEY = "attendxStudents";
const ATTENDANCE_KEY = "attendxAttendance";

function getStudents() {
    return JSON.parse(localStorage.getItem(STUDENTS_KEY) || "[]");
}

function getAttendance() {
    return JSON.parse(localStorage.getItem(ATTENDANCE_KEY) || "[]");
}

// Set today's date automatically
document.getElementById("date").value =
    new Date().toLocaleDateString("en-CA");

// Load students into dropdown
function loadStudents() {

    const students = getStudents();
    const dropdown = document.getElementById("student");

    dropdown.innerHTML = '<option value="">Select a student</option>';

    students.forEach(student => {

        const option = document.createElement("option");

        option.value = student.id;
        option.textContent = student.id + " - " + student.name;

        dropdown.appendChild(option);

    });

    if (students.length === 0) {
        document.getElementById("message").textContent =
            "Please add students in Student Records first.";
    }
}

// Save attendance
document.getElementById("attendanceForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const studentId = document.getElementById("student").value;
    const date = document.getElementById("date").value;
    const status = document.getElementById("status").value;

    if (!studentId || !date) {
        document.getElementById("message").textContent =
            "Please fill in all fields.";
        return;
    }

    const attendance = getAttendance();

    const alreadyExists = attendance.some(record =>
        record.studentId === studentId &&
        record.date === date
    );

    if (alreadyExists) {
        document.getElementById("message").textContent =
            "Attendance already recorded for this student on this date.";
        return;
    }

    attendance.push({
        studentId: studentId,
        date: date,
        status: status
    });

    localStorage.setItem(ATTENDANCE_KEY, JSON.stringify(attendance));

    document.getElementById("message").textContent =
        "Attendance saved successfully!";

    document.getElementById("attendanceForm").reset();

    document.getElementById("date").value =
        new Date().toLocaleDateString("en-CA");

    loadStudents();
    displayAttendance();
    displayPercentages();

});

// Display attendance records
function displayAttendance() {

    const students = getStudents();
    const attendance = getAttendance();

    const table = document.getElementById("attendanceTable");

    table.innerHTML = "";

    attendance.forEach(record => {

        const student = students.find(
            item => item.id === record.studentId
        );

        const row = document.createElement("tr");

        const values = [
            record.studentId,
            student ? student.name : "Unknown",
            record.date,
            record.status
        ];

        values.forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
        });

        table.appendChild(row);

    });

}

// Calculate attendance percentage
function displayPercentages() {

    const students = getStudents();
    const attendance = getAttendance();

    const table = document.getElementById("percentageTable");

    table.innerHTML = "";

    students.forEach(student => {

        const records = attendance.filter(
            item => item.studentId === student.id
        );

        const total = records.length;

        const present = records.filter(
            item => item.status === "Present"
        ).length;

        const percentage = total > 0
            ? (present / total) * 100
            : 0;

        const row = document.createElement("tr");

        const values = [
            student.id,
            student.name,
            total,
            present,
            percentage.toFixed(2) + "%"
        ];

        values.forEach((value, index) => {

            const cell = document.createElement("td");

            cell.textContent = value;

            if (index === 4) {
                cell.className = "percentage";
            }

            row.appendChild(cell);

        });

        table.appendChild(row);

    });

}

// Initial page loading
loadStudents();
displayAttendance();
displayPercentages();

</script>

</body>
</html>
